<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 24 788 726" width="788" height="726" role="img" aria-labelledby="t">
  <title id="t">A chat with Ahmed, who builds wallets, ledgers, payments and AI tools that get double-checked, using Python, TypeScript, Java and Go. Select to open his CV.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 21px; }
    .head { font-size: 24px; font-weight: 700; }
    .status { font-size: 18px; fill: #59636e; text-anchor: end; }
    .q { text-anchor: middle; fill: #ffffff; font-weight: 500; }
    .cv { font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .tag { font-size: 18px; font-weight: 500; }
    .step { animation: rise .45s ease-out backwards; }
    .s2 { animation-delay: .4s; } .s3 { animation-delay: .9s; } .s4 { animation-delay: 2.1s; } .s5 { animation-delay: 2.5s; }
    .s6 { animation-delay: 3s; } .s7 { animation-delay: 3.4s; } .s8 { animation-delay: 3.9s; } .s9 { animation-delay: 4.3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  </style>

  <circle cx="42" cy="44" r="6" fill="#1a7f37"/>
  <text x="58" y="52" class="head">Ask Ahmed</text>
  <text x="824" y="51" class="status">online, and checking the math</text>
  <line x1="36" y1="76" x2="824" y2="76" stroke="#d1d9e0"/>

  <g class="step s1"><rect x="653" y="92" width="171" height="44" rx="14" fill="#0969da"/><text x="738.5" y="121" class="q">who are you?</text></g>
  <g class="step s2"><rect x="36" y="148" width="544" height="74" rx="14" fill="#eff2f5"/><text x="58" y="178">Ahmed. I build wallets, ledgers, payments and AI tools</text><text x="58" y="206">that get double-checked.</text></g>

  <g class="step s3"><rect x="550" y="236" width="274" height="44" rx="14" fill="#0969da"/><text x="687" y="265" class="q">what do you build with?</text></g>
  <g class="step" style="animation-delay:1.20s"><rect x="36" y="292" width="106" height="38" rx="19" fill="#eff2f5"/><circle cx="55" cy="311" r="5" fill="#3572a5"/><text x="68" y="317" class="tag">Python</text></g>
  <g class="step" style="animation-delay:1.25s"><rect x="150" y="292" width="134" height="38" rx="19" fill="#eff2f5"/><circle cx="169" cy="311" r="5" fill="#3178c6"/><text x="182" y="317" class="tag">TypeScript</text></g>
  <g class="step" style="animation-delay:1.30s"><rect x="292" y="292" width="83" height="38" rx="19" fill="#eff2f5"/><circle cx="311" cy="311" r="5" fill="#b07219"/><text x="324" y="317" class="tag">Java</text></g>
  <g class="step" style="animation-delay:1.35s"><rect x="383" y="292" width="72" height="38" rx="19" fill="#eff2f5"/><circle cx="402" cy="311" r="5" fill="#00add8"/><text x="415" y="317" class="tag">Go</text></g>
  <g class="step" style="animation-delay:1.40s"><rect x="463" y="292" width="81" height="38" rx="19" fill="#eff2f5"/><circle cx="482" cy="311" r="5" fill="#e38c00"/><text x="495" y="317" class="tag">SQL</text></g>
  <g class="step" style="animation-delay:1.45s"><rect x="552" y="292" width="108" height="38" rx="19" fill="#eff2f5"/><circle cx="571" cy="311" r="5" fill="#009688"/><text x="584" y="317" class="tag">FastAPI</text></g>
  <g class="step" style="animation-delay:1.50s"><rect x="668" y="292" width="106" height="38" rx="19" fill="#eff2f5"/><circle cx="687" cy="311" r="5" fill="#ff2d20"/><text x="700" y="317" class="tag">Laravel</text></g>
  <g class="step" style="animation-delay:1.55s"><rect x="36" y="338" width="146" height="38" rx="19" fill="#eff2f5"/><circle cx="55" cy="357" r="5" fill="#6db33f"/><text x="68" y="363" class="tag">Spring Boot</text></g>
  <g class="step" style="animation-delay:1.60s"><rect x="190" y="338" width="110" height="38" rx="19" fill="#eff2f5"/><circle cx="209" cy="357" r="5" fill="#5fa04e"/><text x="222" y="363" class="tag">Node.js</text></g>
  <g class="step" style="animation-delay:1.65s"><rect x="308" y="338" width="142" height="38" rx="19" fill="#eff2f5"/><circle cx="327" cy="357" r="5" fill="#4f8ac9"/><text x="340" y="363" class="tag">PostgreSQL</text></g>
  <g class="step" style="animation-delay:1.70s"><rect x="458" y="338" width="92" height="38" rx="19" fill="#eff2f5"/><circle cx="477" cy="357" r="5" fill="#dc382d"/><text x="490" y="363" class="tag">Redis</text></g>
  <g class="step" style="animation-delay:1.75s"><rect x="558" y="338" width="106" height="38" rx="19" fill="#eff2f5"/><circle cx="577" cy="357" r="5" fill="#2496ed"/><text x="590" y="363" class="tag">Docker</text></g>
  <g class="step" style="animation-delay:1.80s"><rect x="672" y="338" width="87" height="38" rx="19" fill="#eff2f5"/><circle cx="691" cy="357" r="5" fill="#8250df"/><text x="704" y="363" class="tag">MCP</text></g>

  <g class="step s4"><rect x="517" y="390" width="307" height="44" rx="14" fill="#0969da"/><text x="670.5" y="419" class="q">can I trust you with money?</text></g>
  <g class="step s5"><rect x="36" y="446" width="515" height="74" rx="14" fill="#eff2f5"/><text x="58" y="476">My ledger reconciled 1,000+ transactions a month.</text><text x="58" y="504">If a posting doesn't balance, it doesn't commit.</text></g>

  <g class="step s6"><rect x="648" y="534" width="176" height="44" rx="14" fill="#0969da"/><text x="736" y="563" class="q">any red flags?</text></g>
  <g class="step s7"><rect x="36" y="590" width="470" height="44" rx="14" fill="#eff2f5"/><text x="58" y="619">One of my tests fails on purpose. Ask me why.</text></g>

  <g class="step s8"><rect x="588" y="648" width="236" height="44" rx="14" fill="#0969da"/><text x="706" y="677" class="q">how do I reach you?</text></g>
  <g class="step s9"><rect x="36" y="704" width="230" height="44" rx="14" fill="#eff2f5"/><text x="58" y="733">Everything's in here:</text><rect x="278" y="704" width="164" height="44" rx="8" fill="#1f883d"/><text x="360" y="733" class="cv">Open my CV</text></g>
</svg>
