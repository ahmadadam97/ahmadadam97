<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" width="720" height="610" role="img" aria-labelledby="t">
  <title id="t">A chat with Ahmed, who builds wallets, ledgers, payments and AI tools that get double-checked. Select to open his CV.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; font-size: 19px; }
    .head { font-size: 22px; font-weight: 700; }
    .status { font-size: 16px; fill: #57606a; }
    .q { text-anchor: end; fill: #ffffff; font-weight: 500; }
    .cv { font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .step { animation: rise .45s ease-out backwards; }
    .s2 { animation-delay: .4s; } .s3 { animation-delay: .9s; } .s4 { animation-delay: 1.3s; }
    .s5 { animation-delay: 1.8s; } .s6 { animation-delay: 2.2s; } .s7 { animation-delay: 2.7s; } .s8 { animation-delay: 3.1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  </style>
  <rect x="0.5" y="0.5" width="719" height="609" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <text x="40" y="50" class="head">Ask Ahmed</text>
  <circle cx="46" cy="72" r="5" fill="#1a7f37"/>
  <text x="58" y="78" class="status">online, and checking the math</text>
  <line x1="40" y1="98" x2="680" y2="98" stroke="#d0d7de"/>

  <g class="step s1"><rect x="540" y="116" width="140" height="40" rx="14" fill="#0969da"/><text x="662" y="143" class="q">who are you?</text></g>
  <g class="step s2"><text x="40" y="190">Ahmed. I build wallets, ledgers, payments and AI tools</text><text x="40" y="216">that get double-checked.</text></g>

  <g class="step s3"><rect x="400" y="236" width="280" height="40" rx="14" fill="#0969da"/><text x="662" y="263" class="q">can I trust you with money?</text></g>
  <g class="step s4"><text x="40" y="310">My ledger reconciled 1,000+ transactions a month.</text><text x="40" y="336">If a posting doesn't balance, it doesn't commit.</text></g>

  <g class="step s5"><rect x="530" y="356" width="150" height="40" rx="14" fill="#0969da"/><text x="662" y="383" class="q">any red flags?</text></g>
  <g class="step s6"><text x="40" y="430">One of my tests fails on purpose. Ask me why.</text></g>

  <g class="step s7"><rect x="480" y="450" width="200" height="40" rx="14" fill="#0969da"/><text x="662" y="477" class="q">how do I reach you?</text></g>
  <g class="step s8"><text x="40" y="524">Everything's in here:</text><rect x="40" y="540" width="150" height="42" rx="6" fill="#1f2328"/><text x="115" y="568" class="cv">Open my CV</text></g>
</svg>
