<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 24 788 572" width="788" height="572" role="img" aria-labelledby="t">
  <title id="t">A chat with Ahmed, who builds wallets, ledgers, payments and AI tools that get double-checked. Select to open his CV.</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #f0f6fc; font-size: 21px; }
    .head { font-size: 24px; font-weight: 700; }
    .status { font-size: 18px; fill: #9198a1; text-anchor: end; }
    .q { text-anchor: middle; fill: #ffffff; font-weight: 500; }
    .cv { font-weight: 600; fill: #ffffff; text-anchor: middle; }
    .step { animation: rise .45s ease-out backwards; }
    .s2 { animation-delay: .4s; } .s3 { animation-delay: .9s; } .s4 { animation-delay: 1.3s; }
    .s5 { animation-delay: 1.8s; } .s6 { animation-delay: 2.2s; } .s7 { animation-delay: 2.7s; } .s8 { animation-delay: 3.1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
    @media (prefers-reduced-motion: reduce) { .step { animation: none; } }
  </style>

  <circle cx="42" cy="44" r="6" fill="#3fb950"/>
  <text x="58" y="52" class="head">Ask Ahmed</text>
  <text x="824" y="51" class="status">online, and checking the math</text>
  <line x1="36" y1="76" x2="824" y2="76" stroke="#3d444d"/>

  <g class="step s1"><rect x="653" y="92" width="171" height="44" rx="14" fill="#1f6feb"/><text x="738.5" y="121" class="q">who are you?</text></g>
  <g class="step s2"><rect x="36" y="148" width="544" height="74" rx="14" fill="#262c36"/><text x="58" y="178">Ahmed. I build wallets, ledgers, payments and AI tools</text><text x="58" y="206">that get double-checked.</text></g>

  <g class="step s3"><rect x="517" y="236" width="307" height="44" rx="14" fill="#1f6feb"/><text x="670.5" y="265" class="q">can I trust you with money?</text></g>
  <g class="step s4"><rect x="36" y="292" width="515" height="74" rx="14" fill="#262c36"/><text x="58" y="322">My ledger reconciled 1,000+ transactions a month.</text><text x="58" y="350">If a posting doesn't balance, it doesn't commit.</text></g>

  <g class="step s5"><rect x="648" y="380" width="176" height="44" rx="14" fill="#1f6feb"/><text x="736" y="409" class="q">any red flags?</text></g>
  <g class="step s6"><rect x="36" y="436" width="470" height="44" rx="14" fill="#262c36"/><text x="58" y="465">One of my tests fails on purpose. Ask me why.</text></g>

  <g class="step s7"><rect x="588" y="494" width="236" height="44" rx="14" fill="#1f6feb"/><text x="706" y="523" class="q">how do I reach you?</text></g>
  <g class="step s8"><rect x="36" y="550" width="230" height="44" rx="14" fill="#262c36"/><text x="58" y="579">Everything's in here:</text><rect x="278" y="550" width="164" height="44" rx="8" fill="#238636"/><text x="360" y="579" class="cv">Open my CV</text></g>
</svg>
